<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回廊 · INFINITE CORRIDOR</title>
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
<main id="app">
  <div id="hud" class="hud hidden" aria-label="战斗状态">
    <div class="hud-left">
      <div class="room-line"><b id="room-name"></b><span id="room-count"></span></div>
      <div id="room-dots" class="dots" aria-hidden="true"></div>
      <div id="hud-room-type" class="hud-extra hidden"></div>
    </div>
    <div class="hud-mid">
      <div class="hp-row">
        <span class="hp-label">生命</span><div id="hp-track" class="hp-track" role="progressbar" aria-label="生命" aria-valuemin="0"><div id="hp-fill" class="hp-fill"></div></div><span id="hp-text" class="hp-text"></span>
      </div>
      <div id="boss-bar" class="boss-bar hidden"><span id="boss-name"></span><div class="boss-track"><div id="boss-fill" class="boss-fill"></div></div></div>
      <div class="battle-detail">
        <span class="dash-status">冲刺 <b id="dash-status">可用</b></span>
        <span id="hud-boss-phase" class="hud-extra hidden"></span>
        <span id="hud-combo" class="hud-extra hidden"></span>
      </div>
      <div id="hint" class="hint"></div>
    </div>
    <div class="hud-right">
      <div class="hud-stats"><span id="source" class="src"></span><span>用时 <b id="timer"></b></span><span id="run-gold">金币 <b id="gold"></b></span></div>
      <div id="perk-chips" class="chips" aria-label="当前强化"></div>
      <div class="hud-actions">
        <span class="theme-tag">主题 <b id="hud-theme"></b></span>
        <button id="btn-mute" class="mini-btn" type="button" aria-keyshortcuts="M">音效 开</button>
        <button id="btn-pause" class="mini-btn" type="button" aria-keyshortcuts="Escape">暂停 <kbd>Esc</kbd></button>
      </div>
    </div>
  </div>

  <div id="stage" class="stage" data-screen="start">
    <canvas id="game" width="960" height="600" tabindex="-1" aria-label="回廊战斗区域"></canvas>
    <div id="toast" class="toast" role="status"></div>
    <div id="overlay" class="overlay">
      <section id="screen-start" class="panel start-panel" tabindex="-1" aria-labelledby="start-title">
        <header class="home-brand">
          <div class="brand-line"><span aria-hidden="true">∞</span> INFINITE CORRIDOR</div>
          <h1 id="start-title">回廊</h1>
          <p>击飞 · 反弹 · 接力</p>
        </header>

        <div class="home-modes" aria-label="战斗模式">
          <button id="btn-loop" class="mode-entry featured" type="button">
            <span><b>回廊长局</b><small>三层回廊 · 绕一圈，从另一侧回击 · 层末存档续玩</small></span><span aria-hidden="true">→</span>
          </button>
          <button id="btn-loop-continue" class="mode-entry continue hidden" type="button">
            <span><b>继续回廊</b><small>从上次离开的廊口接着走</small></span><span aria-hidden="true">→</span>
          </button>
          <button id="btn-trial-setup" class="mode-entry" type="button">
            <span><b>单房试玩</b><small>两拨连续战斗，出发前选武器与设置</small></span><span aria-hidden="true">→</span>
          </button>
          <button id="btn-start" class="mode-entry" type="button">
            <span><b>经典射击</b><small>原版长局 · 探索房间、收集词条、挑战首领</small></span><span aria-hidden="true">→</span>
          </button>

          <div class="home-experiments">
            <div class="mode-group">
              <label class="field compact" for="impact-weapon">武器
                <select id="impact-weapon"><option value="blade">重刃</option><option value="cannon">手炮</option></select>
              </label>
              <div class="button-row">
                <button id="btn-impact" class="btn secondary" type="button">击飞接力</button>
                <button id="btn-impact-combinations" class="btn secondary" type="button">碰撞组合</button>
              </div>
            </div>
            <div class="mode-group">
              <label class="field compact" for="recall-layout">站位
                <select id="recall-layout"><option value="A">A</option><option value="B">B</option></select>
              </label>
              <button id="btn-recall" class="btn secondary" type="button">廊道回扫</button>
            </div>
          </div>
        </div>

        <div class="home-settings">
          <div id="theme-host"></div>
          <button id="btn-unlock-start" class="btn link-button" type="button">局外解锁 ↗</button>
        </div>
        <div class="controls-inline"><span><kbd>WASD</kbd> 移动</span><span><kbd>左键</kbd> 攻击</span><span><kbd>Shift</kbd> 冲刺</span><span><kbd>Esc</kbd> 暂停</span></div>
      </section>

      <section id="screen-trial" class="panel trial-panel hidden" tabindex="-1" aria-labelledby="trial-title">
        <header class="panel-head">
          <h2 id="trial-title" class="panel-title">单房试玩</h2>
          <p class="panel-desc">选好设置，连续迎战两拨敌人。</p>
        </header>
        <div class="trial-settings">
          <label class="field" for="trial-version">版本
            <select id="trial-version"><option value="A">版本 A</option><option value="B">版本 B</option></select>
          </label>
          <label class="field" for="trial-weapon">武器
            <select id="trial-weapon"><option value="blade">重刃</option><option value="cannon">手炮</option></select>
          </label>
          <label class="field" for="trial-preset">预设
            <select id="trial-preset"><option value="basic">预设 1</option><option value="skills">预设 2</option></select>
          </label>
        </div>
        <div class="controls-inline"><span><kbd>WASD</kbd> 移动</span><span><kbd>左键</kbd> 攻击</span><span><kbd>Shift</kbd> 冲刺</span><span><kbd>Esc</kbd> 暂停</span></div>
        <div class="start-actions">
          <button id="btn-trial-start" class="btn primary" type="button">进入房间 <span aria-hidden="true">→</span></button>
          <button id="btn-trial-back" class="btn secondary" type="button">返回首页</button>
        </div>
      </section>

      <section id="screen-loading" class="panel loading-panel hidden" tabindex="-1" aria-labelledby="loading-title">
        <h2 id="loading-title" class="panel-title" role="status">正在准备关卡</h2>
      </section>

      <section id="screen-perk" class="panel perk-panel hidden" tabindex="-1" aria-labelledby="perk-title">
        <header class="panel-head">
          <p class="panel-kicker" id="perk-room"></p>
          <h2 class="panel-title" id="perk-title">选择强化</h2>
          <p class="panel-desc" id="perk-sub"></p>
        </header>
        <div id="perk-cards" class="perk-cards"></div>
      </section>

      <section id="screen-end" class="panel end-panel hidden" tabindex="-1" aria-labelledby="end-title">
        <header class="panel-head">
          <h2 id="end-title" class="end-title panel-title"></h2>
          <p id="end-summary" class="panel-desc"></p>
        </header>
        <div id="end-stats" class="stats"></div>
        <p id="end-wallet" class="end-gold">持有金币 <b id="end-gold">0</b></p>
        <div class="end-actions">
          <button id="btn-restart" class="btn primary" type="button">再来一局 <kbd>R</kbd></button>
          <button id="btn-unlock" class="btn secondary" type="button">局外解锁</button>
          <button id="btn-end-home" class="btn secondary" type="button">返回首页</button>
        </div>
      </section>

      <section id="screen-unlock" class="panel unlock-panel hidden" tabindex="-1" aria-labelledby="unlock-title">
        <header class="unlock-head">
          <div><h2 id="unlock-title" class="panel-title">局外解锁</h2><p class="panel-desc">解锁后的词条会随原版长局开局装入。</p></div>
          <div class="unlock-head-right">
            <div class="wallet">金币 <b id="unlock-gold"></b></div>
            <button id="unlock-close" class="icon-btn" type="button" aria-label="关闭局外解锁">×</button>
          </div>
        </header>
        <div id="unlock-grid" class="unlock-grid" tabindex="0" aria-label="可解锁词条"></div>
        <button id="unlock-back" class="btn secondary" type="button" data-from="start">返回 <kbd>Esc</kbd></button>
      </section>

      <section id="screen-pause" class="panel pause-panel hidden" tabindex="-1" aria-labelledby="pause-title">
        <header class="panel-head"><h2 id="pause-title" class="panel-title">已暂停</h2><p id="pause-context" class="panel-desc"></p></header>
        <div class="pause-actions">
          <button id="btn-resume" class="btn primary" type="button">继续 <kbd>Esc</kbd></button>
          <button id="btn-pause-restart" class="btn secondary" type="button">重开本局</button>
          <button id="btn-pause-home" class="btn secondary" type="button">返回首页</button>
        </div>
      </section>
    </div>
  </div>
</main>
<script>window.Corridor = window.Corridor || {};</script>
<script src="src/core/perks.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/core/recall.js"></script>
<script src="src/core/loop.js"></script>
<script src="src/core/enemy-trial.js"></script>
<script src="src/core/impact.js"></script>
<script src="src/core/engine.js"></script>
<script src="src/theme/index.js"></script>
<script src="src/gen/templates.js"></script>
<script src="src/gen/schema.js"></script>
<script src="src/gen/index.js"></script>
<script src="src/ui/combat-guide.js"></script>
<script src="src/ui/render.js"></script>
<script src="src/ui/screens.js"></script>
<script src="src/ui/main.js"></script>
</body>
</html>
